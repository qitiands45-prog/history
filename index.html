<div id="gate-screen" style="position:fixed; inset:0; z-index:9999; background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--ink); font-family:var(--sans); padding:20px;">

<!-- ================= 核心脚本 ================= -->
<script>
// 密码列表 (你要卖的数字)
const VALID_CODES = [
  "1048", "2159", "3876", "4790", "5621",
  "6354", "7482", "8593", "9214", "1935",
  "2846", "3957", "4168", "5279", "6380",
  "7491", "8502", "9613", "1724", "2835",
  "3946", "4157", "5268", "6379", "7480",
  "8591", "9602", "1713", "2824", "3935"
];

// 验证码交互逻辑
document.addEventListener('DOMContentLoaded', () => {
  const gate = document.getElementById('gate-screen');
  const mainShell = document.getElementById('main-shell');
  const input = document.getElementById('access-code');
  const btn = document.getElementById('verify-btn');
  const errorMsg = document.getElementById('gate-error');

  if (localStorage.getItem('quiz_unlocked') === 'true') {
    gate.style.display = 'none';
    return;
  }

  mainShell.style.display = 'none';

  btn.addEventListener('click', () => {
    const code = input.value.trim();
    if (VALID_CODES.includes(code)) {
      localStorage.setItem('quiz_unlocked', 'true');
      gate.style.display = 'none';
      mainShell.style.display = 'block';
      if (window.initQuiz) window.initQuiz();
    } else {
      errorMsg.style.opacity = '1';
      input.style.borderColor = '#a16952';
      input.value = '';
      setTimeout(() => {
        errorMsg.style.opacity = '0';
        input.style.borderColor = 'var(--line)';
      }, 3000);
    }
  });

  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') btn.click();
  });
});
</script>

{"id":"q07","dimension":"explore","context":"出行路线","prompt":"去一个常去的地方，有几条路都安全、方便，耗时也相近。时间不紧时，你通常选哪种？","options":[{"id":"a","text":"大多走熟路，偶尔换一小段。","score":1,"evidence":"路线条件相近时，你选择以熟路为主，偶尔换一小段。"},{"id":"b","text":"通常优先选还没走过的那条。","score":3,"evidence":"路线条件相近时，你选择优先尝试没走过的路线。"},{"id":"c","text":"走一直熟悉的路，少做一次选择。","score":0,"evidence":"路线条件相近时，你选择熟悉的路线。"},{"id":"d","text":"经常换一条没走过的路，也会走熟路。","score":2,"evidence":"路线条件相近时，你选择经常尝试没走过的路线。"}],"rationale":"测量主动接触陌生环境的倾向。"},{"id":"q08","dimension":"organize","context":"整理物品","prompt":"你打算整理一个自己的柜子，东西不多，随时可以调整。动手前，你通常会怎么准备？","options":[{"id":"a","text":"先列好分类、位置和整理顺序，再动手。","score":3,"evidence":"整理柜子前，你选择提前安排分类、位置与操作顺序。"},{"id":"b","text":"先想好最需要腾出的一块位置。","score":1,"evidence":"整理柜子前，你选择先确定最需要处理的重点位置。"},{"id":"c","text":"先分好几类，想清各类大致放哪里。","score":2,"evidence":"整理柜子前，你选择提前确定分类和主要位置。"},{"id":"d","text":"先拿出一部分，边整理边决定放哪里。","score":0,"evidence":"整理柜子前，你选择先开始，再决定具体位置。"}],"rationale":"只比较开始前的组织程度。"},{"id":"q09","dimension":"persist","context":"长期个人项目","prompt":"一个你仍觉得值得做的个人项目，需要几周才看得出变化。现有安排能够负担，你会怎样投入？","options":[{"id":"a","text":"大多数周都会做一点，慢慢推进。","score":2,"evidence":"个人项目暂时看不到变化时，你选择大多数周继续推进。"},{"id":"b","text":"先放一放，之后有兴致再继续。","score":0,"evidence":"个人项目暂时看不到变化时，你选择先放一放。"},{"id":"c","text":"想起来就推进一些，不要求每周都做。","score":1,"evidence":"个人项目暂时看不到变化时，你选择不定期推进。"},{"id":"d","text":"按自己能负担的频率持续推进，直到一个阶段结束。","score":3,"evidence":"个人项目暂时看不到变化时，你选择持续投入到一个阶段结束。"}],"rationale":"比较延迟反馈下投入的连续性。"},{"id":"q10","dimension":"initiate","context":"共同小任务","prompt":"几个人一起做一件简单的小任务，大家都了解要做什么，还没有分工。你一般会怎么做？","options":[{"id":"a","text":"通常等别人提出分工，再选自己的部分。","score":0,"evidence":"共同任务尚未分工时，你通常等别人提出分工后再参与。"},{"id":"b","text":"经常先提一版分工，再和大家商量。","score":2,"evidence":"共同任务尚未分工时，你经常会先提出分工建议。"},{"id":"c","text":"大多时候都会先提分工，邀请大家调整。","score":3,"evidence":"共同任务尚未分工时，你大多会主动提出第一版分工。"},{"id":"d","text":"偶尔先提怎么分，大多时候让别人起头。","score":1,"evidence":"共同任务尚未分工时，你偶尔会先提出分工建议。"}],"rationale":"比较发起协作的主动程度。"},{"id":"q11","dimension":"independent","context":"日常评价","prompt":"几位熟人谈起一件你也了解经过的日常小事，大家看法相近，你们知道的信息一样。你会怎样形成看法？","options":[{"id":"a","text":"自己整理几条理由，再决定同意哪些部分。","score":2,"evidence":"讨论同样了解的日常小事时，你选择自己整理理由再判断。"},{"id":"b","text":"先采用大家的共同看法，继续交流。","score":0,"evidence":"讨论同样了解的日常小事时，你选择先采用共同看法。"},{"id":"c","text":"核对一个自己在意的细节，再决定是否同意。","score":1,"evidence":"讨论同样了解的日常小事时，你选择核对一个细节后再判断。"},{"id":"d","text":"先形成一套自己的理解，再对照大家的说法。","score":3,"evidence":"讨论同样了解的日常小事时，你选择先形成自己的理解再对照。"}],"rationale":"比较形成看法时自主检视的程度。"},{"id":"q12","dimension":"care","context":"熟人近况","prompt":"一位熟人最近比平时沉默，你们都还有自己的事情要做，对方也没有主动诉说。你通常会？","options":[{"id":"a","text":"大多会留出有限时间，主动了解近况和是否需要支持。","score":3,"evidence":"熟人没有主动诉说时，你大多会留出有限时间了解近况及具体需要。"},{"id":"b","text":"偶尔找个空档，简单问候一下。","score":1,"evidence":"熟人没有主动诉说时，你偶尔会主动找空档问候。"},{"id":"c","text":"经常会抽一点时间，问问对方愿意谈的近况。","score":2,"evidence":"熟人没有主动诉说时，你经常会主动了解对方愿意谈的近况。"},{"id":"d","text":"通常照常相处，等对方愿意说时再听。","score":0,"evidence":"熟人没有主动诉说时，你通常照常相处并等待对方开口。"}],"rationale":"测量主动关注未明确表达的需要。"},
{"id":"q13","dimension":"explore","context":"休闲体验","prompt":"有一段休闲时间，几种活动都符合你的兴趣，花费和参与难度相近。你通常偏向哪种？","options":[{"id":"a","text":"选大部分内容没体验过、还有一点熟悉感的。","score":2,"evidence":"选择休闲活动时，你倾向于大部分内容尚未体验过的活动。"},{"id":"b","text":"选做过且喜欢的，享受熟悉的感觉。","score":0,"evidence":"选择休闲活动时，你倾向于做过且喜欢的活动。"},{"id":"c","text":"选熟悉活动的新版本，变化不用太大。","score":1,"evidence":"选择休闲活动时，你倾向于熟悉活动的小幅变化。"},{"id":"d","text":"选自己还没体验过的，看看会怎样。","score":3,"evidence":"选择休闲活动时，你倾向于尚未体验过的活动。"}],"rationale":"比较体验的新颖程度。"},{"id":"q14","dimension":"organize","context":"一周事项","prompt":"下周有几件不紧急、能自行安排的事情。必要信息已经齐了，你一般会怎样安排？","options":[{"id":"a","text":"记住有哪些事，每天空下来再选着做。","score":0,"evidence":"安排一周事项时，你选择当天有空再决定做哪件事。"},{"id":"b","text":"给主要事项安排大致的日子或时间段。","score":2,"evidence":"安排一周事项时，你选择提前分配主要事项的时间。"},{"id":"c","text":"排好先后和时间段，再留出调整的空档。","score":3,"evidence":"安排一周事项时，你选择提前安排顺序、时间和调整空间。"},{"id":"d","text":"先确定最重要的一两件，其余看情况。","score":1,"evidence":"安排一周事项时，你选择提前确定少数重点。"}],"rationale":"测量事前时间组织。"},{"id":"q15","dimension":"persist","context":"重复工作","prompt":"你在为自己整理一套以后会用到的资料，价值明确，只是有些步骤很重复，时间也够。你会怎样做？","options":[{"id":"a","text":"保持可负担的节奏，推进到当前一批完成。","score":3,"evidence":"资料整理进入重复步骤时，你选择持续投入到当前一批完成。"},{"id":"b","text":"隔一阵整理一点，不要求连续推进。","score":1,"evidence":"资料整理进入重复步骤时，你选择间隔着推进。"},{"id":"c","text":"大多数时候接着做，偶尔停一阵再回来。","score":2,"evidence":"资料整理进入重复步骤时，你选择多数时候继续，偶尔暂停后再回来。"},{"id":"d","text":"先停下来，等重新想做时再接着整理。","score":0,"evidence":"资料整理进入重复步骤时，你选择先暂停。"}],"rationale":"测量对仍有用的重复任务保持投入的程度。"},{"id":"q16","dimension":"initiate","context":"共享空间","prompt":"你和几位同伴都觉得共用空间可以稍作调整，大家权限一样，还没有人提出怎么开始。你会怎样？","options":[{"id":"a","text":"偶尔主动提个建议，大多时候先听别人说。","score":1,"evidence":"共用空间准备调整时，你偶尔会主动提出建议。"},{"id":"b","text":"大多时候由我先发起商量，给出起步建议。","score":3,"evidence":"共用空间准备调整时，你大多会主动发起商量并提出建议。"},{"id":"c","text":"通常等有人提办法，再说自己能配合什么。","score":0,"evidence":"共用空间准备调整时，你通常等别人提出办法后再配合。"},{"id":"d","text":"经常主动提一个调整建议，和大家商量。","score":2,"evidence":"共用空间准备调整时，你经常会主动提出调整建议。"}],"rationale":"比较主动开启协调的程度。"},{"id":"q17","dimension":"independent","context":"日用品比较","prompt":"你和朋友在比较两款都合用的日用品，价格相近，大家看的信息一样，也都没用过。你通常如何选？","options":[{"id":"a","text":"确认一个自己最在意的条件，合适就跟着选。","score":1,"evidence":"比较同样合用的日用品时，你选择核对一个个人重点后再选。"},{"id":"b","text":"先按自己的取舍形成判断，再对照共同推荐。","score":3,"evidence":"比较同样合用的日用品时，你选择先按自己的标准判断。"},{"id":"c","text":"采用大家更推荐的一款，少花些比较时间。","score":0,"evidence":"比较同样合用的日用品时，你选择采用共同推荐。"},{"id":"d","text":"自己比较几项重要条件，再决定选哪款。","score":2,"evidence":"比较同样合用的日用品时，你选择自行比较重要条件。"}],"rationale":"比较自主判断程度。"},{"id":"q18","dimension":"care","context":"分享好消息","prompt":"一位朋友告诉你最近一件顺利的事，愿意多聊几句，你也有一点可自由安排的时间。你通常会？","options":[{"id":"a","text":"通常表达祝贺，随后回到自己的安排。","score":0,"evidence":"朋友分享好消息时，你通常祝贺后回到自己的安排。"},{"id":"b","text":"经常会多听一会，了解对方在意的地方。","score":2,"evidence":"朋友分享好消息时，你经常会主动了解对方在意的地方。"},{"id":"c","text":"大多会认真听对方在意的部分，之后也常主动问起。","score":3,"evidence":"朋友分享好消息时，你大多会了解对方在意的部分，之后也常主动问起。"},{"id":"d","text":"偶尔会多问几句，听听事情的进展。","score":1,"evidence":"朋友分享好消息时，你偶尔会主动多问几句。"}],"rationale":"比较关注深度与延续性。"},
{"id":"q19","dimension":"explore","context":"日常工具","prompt":"一件小事有两种工具：旧工具顺手，新工具也易上手、效果相近。这次处理时，你会怎么选？","options":[{"id":"a","text":"这次优先用新工具，完整体验一下。","score":3,"evidence":"选择日常工具时，你选择优先完整体验新工具。"},{"id":"b","text":"大部分用旧工具，挑一小段试试新的。","score":1,"evidence":"选择日常工具时，你选择在小部分工作上试用新工具。"},{"id":"c","text":"主要用新工具，需要时再用旧工具。","score":2,"evidence":"选择日常工具时，你选择主要试用新工具，并保留旧工具。"},{"id":"d","text":"继续用旧工具，保持现有习惯。","score":0,"evidence":"选择日常工具时，你选择保持已经顺手的使用习惯。"}],"rationale":"比较采用陌生工具的程度。"},{"id":"q20","dimension":"organize","context":"分享经验","prompt":"你要向几位熟人分享一段自己熟悉的经验，资料已经有了，形式也很随意。开始前你会怎么准备？","options":[{"id":"a","text":"记下最想说的两三个点。","score":1,"evidence":"分享经验前，你选择提前记下少数重点。"},{"id":"b","text":"列好顺序、例子和时间，想好删减哪些内容。","score":3,"evidence":"分享经验前，你选择提前安排内容、时间和删减方案。"},{"id":"c","text":"先想好开头，聊到哪里再接着说。","score":0,"evidence":"分享经验前，你选择只确定开头，后续边说边组织。"},{"id":"d","text":"把重点按顺序列好，配上几个例子。","score":2,"evidence":"分享经验前，你选择提前安排重点顺序和例子。"}],"rationale":"测量表达任务前的组织程度。"},{"id":"q21","dimension":"persist","context":"习惯维持","prompt":"你给自己选了一个仍然有用的小习惯，做起来不吃力，但短期看不出明显效果。你通常会怎样？","options":[{"id":"a","text":"先停一段时间，以后需要时再恢复。","score":0,"evidence":"小习惯短期效果不明显时，你选择先暂停，以后需要时再恢复。"},{"id":"b","text":"多数时候继续做，偶尔停一阵再接上。","score":2,"evidence":"小习惯短期效果不明显时，你选择多数时候继续，偶尔暂停后再接上。"},{"id":"c","text":"维持自己能负担的原有频率，再过一段时间评估。","score":3,"evidence":"小习惯短期效果不明显时，你选择维持可负担的原有频率后再评估。"},{"id":"d","text":"想起时就做，不要求维持固定频率。","score":1,"evidence":"小习惯短期效果不明显时，你选择想起时再做。"}],"rationale":"比较长期收益尚不明显时的持续性。"},{"id":"q22","dimension":"initiate","context":"讨论推进","prompt":"小组在几个可行方案之间来回讨论，大家信息相同，也没有主持人。你通常怎样参与下一步？","options":[{"id":"a","text":"经常先提一个往下讨论的办法。","score":2,"evidence":"小组讨论尚未形成下一步时，你经常会主动提出推进办法。"},{"id":"b","text":"通常等别人提下一步，再表达自己的意见。","score":0,"evidence":"小组讨论尚未形成下一步时，你通常等待他人提出推进办法。"},{"id":"c","text":"偶尔提出下一步，大多时候先听别人怎么说。","score":1,"evidence":"小组讨论尚未形成下一步时，你偶尔会主动提出推进办法。"},{"id":"d","text":"大多时候会先提下一步，请大家确认或修改。","score":3,"evidence":"小组讨论尚未形成下一步时，你大多会主动提出推进办法。"}],"rationale":"测量无主持情况下发起推进的倾向。"},{"id":"q23","dimension":"independent","context":"沿用做法","prompt":"一个共同的小任务又要开始，大家倾向沿用上次的办法。你们了解的条件一样，也没有专业差异。你会？","options":[{"id":"a","text":"先独立判断这次适合怎样做，再与旧办法对照。","score":3,"evidence":"面对共同认可的旧办法，你选择先形成自己的判断再对照。"},{"id":"b","text":"核对这次最关键的一点，没问题就照旧。","score":1,"evidence":"面对共同认可的旧办法，你选择核对一个关键条件后决定。"},{"id":"c","text":"自己重新比较这次的几个条件，再决定是否照旧。","score":2,"evidence":"面对共同认可的旧办法，你选择自行比较当前条件。"},{"id":"d","text":"采用共同认可的办法，直接往下做。","score":0,"evidence":"面对共同认可的旧办法，你选择采用它继续行动。"}],"rationale":"比较采用共识前自主检视的范围。"},{"id":"q24","dimension":"care","context":"共同安排","prompt":"共同活动的基本安排已经定好，你的条件都合适，但几位同伴还没说是否有不便。你通常会？","options":[{"id":"a","text":"经常会主动问问具体不便，看看能调整哪一点。","score":2,"evidence":"共同活动已定安排时，你经常会主动了解具体不便并考虑局部调整。"},{"id":"b","text":"通常按已定安排准备，等有人提出不便。","score":0,"evidence":"共同活动已定安排时，你通常等待同伴提出具体不便。"},{"id":"c","text":"偶尔会顺口问一句大家是否方便。","score":1,"evidence":"共同活动已定安排时，你偶尔会主动确认大家是否方便。"},{"id":"d","text":"大多会主动确认他人的需要，再作自己能承担的调整。","score":3,"evidence":"共同活动已定安排时，你大多会主动确认需要并作可承担的调整。"}],"rationale":"主要测量对他人具体体验的自发关注。"},

const complete = () => answered() === QUESTIONS.length;

function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch {} }
function loadDraft() { try { const s = JSON.parse(localStorage.getItem(DRAFT_KEY)); return s && s.version === 2 ? s : null; } catch { return null; } }
function persist() { saveDraft(); }
function announce(msg) { document.getElementById('status-message').textContent = msg; }

// 切换版本
window.switchEdition = function(id) {
  if (!E.EDITIONS.some(e => e.id === id)) return;
  edition = id;
  history.replaceState(null, '', '?edition=' + id);
  state.view = 'cover';
  persist();
  render();
}

window.initQuiz = function() {
  const draft = loadDraft();
  state = draft ? E.normalizeState(draft, QUESTIONS) : E.normalizeState(null, QUESTIONS);
  renderRoster();
  render(false);
};

function render(move = true) {
  renderNavigation();
  document.getElementById('site-footer').hidden = (state.view === 'quiz' || !edition);
  
  if (!edition) {
    app.innerHTML = landingPage();
    if (move) window.scrollTo(0, 0);
    return;
  }
  
  app.innerHTML = state.view === 'quiz' ? quizView() : state.view === 'result' && complete() ? results() : cover();
  if (move) { window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
}

function landingPage() {
  return `<section class="cover" style="text-align:center; padding-top: 40px;">
    <div class="brand" style="justify-content: center; margin-bottom: 32px; display: flex; align-items: center; gap: 7px;">
      <span class="brand-symbol" style="font-size: 23px; color: var(--green);">✳</span>
      <span style="font-size: 14px; font-weight: 600; letter-spacing: 1px;">时光来信</span>
      <span class="brand-en" style="font-size: 9px; color: var(--muted); letter-spacing: 1.1px; margin-left: 6px;">TIME & YOU</span>
    </div>
    <h1 style="font-family: var(--serif); font-size: 38px; font-weight: 500; line-height: 1.5; margin-bottom: 16px;">你更像<br>历史上的谁？</h1>
    <p style="font-size: 14px; color: #70776e; line-height: 1.9; margin-bottom: 36px;">36道日常选择，在96位中外历史人物中，<br>遇见一位与你处事方式相近的人。</p>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <button class="primary-button" onclick="window.switchEdition('china')">进入中国版 <span aria-hidden="true">→</span></button>
      <button class="secondary-button" onclick="window.switchEdition('world')">进入外国版 <span aria-hidden="true">→</span></button>
    </div>
    <div class="facts" style="margin-top: 28px;"><span>一位主匹配</span><i></i><span>两位相近人物</span><i></i><span>免登录</span></div>
  </section>`;
}

function renderNavigation() {
  const nav = document.getElementById('edition-nav');
  if (!edition) { nav.style.display = 'none'; document.getElementById('about-button').style.display = 'none'; return; }
  nav.style.display = 'flex';
  document.getElementById('about-button').style.display = 'block';
  nav.innerHTML = '<div class="edition-tabs">' +
    E.EDITIONS.map(e => '<a href="javascript:void(0)" data-edition="' + e.id + '"' +
      (edition === e.id ? ' aria-current="page"' : '') + '>' + e.name + '<small>48人</small></a>').join('') +
    '</div><span class="edition-note">' + (state.view === 'result' ? '同一份答案，两种相遇' : '两版共用答题进度') + '</span>';
  document.title = '你更像历史上的谁？' + editionData().name + '｜时光来信';
}

function cover() {
  const n = answered(), isDone = complete();
  const names = edition === 'china' ? ['苏轼', '王贞仪', '李小龙'] : ['达·芬奇', '南丁格尔', '阿里'];
  return '<section class="cover"><p class="cover-kicker eyebrow">A LETTER THROUGH TIME · ' + editionData().number + '</p>' +
    '<h1>你更像<br>历史上的<span class="serif-accent">谁？</span></h1>' +
    '<p class="cover-subtitle">把日常里的选择，寄往时间深处。<br>在48种人生里，遇见与你相近的回响。</p>' +
    '<div class="letter-art" aria-hidden="true"><div class="orbit-line"></div><span class="little-spark">✳</span>' +
    '<div class="letter-slip slip-left"><span>不同的人生</span><strong>' + names[0] + '</strong><i>一份相近的侧影</i></div>' +
    '<div class="letter-slip slip-right"><span>相似的选择</span><strong>' + names[2] + '</strong><i>另一种可能</i></div>' +
    '<div class="letter-slip slip-main"><span>HISTORY & YOU</span><div class="letter-seal">' + editionData().mark + '</div><strong>' + names[1] + '</strong><i>也许，你们会在这里相遇</i></div>' +
    '<span class="art-caption">见字如面，见己如初。</span></div>' +
    '<div class="cover-facts"><span>36道日常选择</span><i></i><span>预计6–9分钟</span><i></i><span>免登录</span></div>' +
    (n ? '<div class="resume-note"><span>' + (isDone ? '这份答案已完成，可以直接查看结果' : '已选择 ' + n + ' / ' + QUESTIONS.length + ' 题') + '</span><button data-action="reset">清空</button></div>' : '') +
    '<button class="primary-button" data-action="start">' + (isDone ? '打开我的' + editionData().name + '来信' : n ? '继续这份来信' : '开始寻找我的回响') + '<span aria-hidden="true">→</span></button>' +
    '<p class="cover-reminder">一位主匹配人物 ＋ 两位相近人物<br>按最近半年通常会做的选择来答，不必选理想中的自己。</p></section>';
}

function quizView() {
  const q = QUESTIONS[state.index], n = answered(), selected = state.answers[q.id];
  return '<section class="quiz"><div class="quiz-progress-top"><span>' +
    (state.reviewing ? '回看你的选择' : '按你的日常来选') + '</span><strong>第 ' + (state.index + 1) + ' / ' + QUESTIONS.length + ' 题</strong></div>' +
    '<div class="progress-track" role="progressbar" aria-label="已回答题数" aria-valuemin="0" aria-valuemax="' + QUESTIONS.length + '" aria-valuenow="' + n + '">' +
    '<div class="progress-fill" style="width:' + (n / QUESTIONS.length * 100) + '%"></div></div>' +
    '<p class="question-eyebrow"><span class="tiny-dot"></span>' + esc(q.context) + '</p>' +
    '<h1 class="question-title" id="question-title">' + esc(q.prompt) + '</h1>' +
    '<p class="question-subtitle">选择最接近你通常做法的一项。</p>' +
    '<div class="options" role="radiogroup" aria-labelledby="question-title">' +
    q.options.map((o, i) => '<label class="option' + (selected === o.id ? ' selected' : '') + '">' +
      '<input type="radio" name="answer" value="' + esc(o.id) + '"' + (selected === o.id ? ' checked' : '') + '>' +
      '<span class="option-letter" aria-hidden="true">' + 'ABCD'[i] + '</span>' +
      '<span class="option-text">' + esc(o.text) + '</span></label>').join('') + '</div>' +
    '<p class="question-footer">选择已保存在本地浏览器。</p>' +
    (state.reviewing && complete() ? '<button class="text-button update-result" data-action="result" style="margin: 12px auto 0; color: #566c5a; text-decoration: underline; display: block;">用修改后的答案更新结果 →</button>' : '') +
    '<div class="quiz-nav"><button class="previous-button" data-action="previous"' +
    (state.index === 0 ? ' disabled' : '') + '>← 上一题</button>' +
    '<button id="next-button" class="primary-button" data-action="next"' +
    (!selected ? ' disabled' : '') + '>' +
    (state.index === QUESTIONS.length - 1 ? '打开我的来信' : '下一题') +
    '<span aria-hidden="true">→</span></button></div></section>';
}

function scoreMarkup(r, compact) {
  return '<div class="' + (compact ? 'compact-score' : 'match-score') + '">' +
    '<span class="match-caption">相似度</span><strong>' + r.matchPercent + '<small>%</small></strong>' +
    (!compact ? '<span class="match-bar" aria-hidden="true"><span style="width:' + r.matchPercent + '%"></span></span>' : '') +
    '</div>';
}

function sourcesDetails(person, includeIntro) {
  return '<details class="person-source"><summary>认识' + esc(shortName(person)) + '</summary>' +
    '<div class="source-content">' +
    (includeIntro ? '<p class="source-intro">' + esc(person.intro) + '</p>' : '') +
    '<p>' + esc(person.interpretation) + '</p></div></details>';
}

function explanation(person, scores) {
  const facets = E.selectFacets(scores, person);
  if (!facets.length) return '';
  return '<h3 class="subheading">从你的选择，看见相似</h3><ol class="similarities">' +
    facets.map((d, i) => {
      const picked = E.chooseAnswerEvidence(d, QUESTIONS, state.answers);
      const ev = E.sourceEvent(person, d.id);
      return '<li class="similarity"><span class="sim-number">0' + (i + 1) + '</span><div>' +
        '<strong>' + d[E.band(d.user)] + '</strong>' +
        '<p class="answer-evidence">你在「' + esc(picked.question.context) + '」中选择：<br>"' + esc(picked.option.text) + '"</p>' +
        '<p class="history-evidence"><span>' + esc(shortName(person)) + '的经历</span>' + esc(ev?.event || '') + '</p>' +
        '</div></li>';
    }).join('') + '</ol>';
}

function mainCard(r, scores, check) {
  const p = r.person, tags = E.sharedTags(scores, p), delta = E.difference(scores, p);
  return '<article class="person-card primary-person" id="main-match">' +
    '<div class="person-head" data-mark="' + editionData().mark + '">' +
    '<div class="person-group"><span>' + (check.exactTie ? '你的主匹配人物 · 并列' : '你的主匹配人物') + '</span><span>THE CLOSEST ECHO</span></div>' +
    '<h2 class="person-name">' + esc(p.name) + '</h2>' +
    '<p class="person-meta">' + esc(p.era) + ' · ' + esc(p.role) + '</p>' +
    '<p class="person-tagline">' + esc(p.tagline) + '</p>' +
    scoreMarkup(r) +
    (tags.length ? '<div class="person-tags">' + tags.map(t => '<span>' + esc(t) + '</span>').join('') + '</div>' : '') +
    '</div><div class="person-body"><p class="person-description">' + esc(p.intro) + '</p>' +
    '<div class="person-divider"></div>' + explanation(p, scores) +
    (delta ? '<div class="difference-note"><strong>你们也有不同</strong><p>在「' + delta.name + '」上，你更偏向「' +
      delta[E.band(delta.user)] + '」，而' + esc(shortName(p)) + '更偏向「' + delta[E.band(delta.target)] + '」。</p></div>' : '') +
    sourcesDetails(p) + '</div></article>';
}

function neighborReason(r, scores, main) {
  const better = E.closestFacets(scores, r.person)
    .filter(d => main.person.profile[d.id] !== null && d.gap + 1 < Math.abs(scores[d.id] - main.person.profile[d.id]))
    .sort((a, b) => (Math.abs(scores[b.id] - main.person.profile[b.id]) - b.gap) - (Math.abs(scores[a.id] - main.person.profile[a.id]) - a.gap))[0];
  if (better) return '在「' + better.name + '」上，与你更加相近。';
  if (Math.abs(r.farSquared - main.farSquared) < 1e-9) return '与你同样相近，也值得认识。';
  const facets = E.selectFacets(scores, r.person, 2);
  if (facets.length) return '你们也在「' + facets.map(d => d[E.band(d.user)]).join('」「') + '」上相近。';
  return '也是与你相近的一位人物。';
}

function neighborCard(r, index, scores, main) {
  return '<article class="neighbor-card neighbor-' + index + '"><div class="neighbor-top"><div>' +
    '<p class="neighbor-label">相近人物 0' + index + '</p>' +
    '<h3>' + esc(r.person.name) + '</h3>' +
    '<p class="person-meta">' + esc(r.person.role) + '</p></div>' +
    '<span class="neighbor-number" aria-hidden="true">0' + (index + 1) + '</span></div>' +
    scoreMarkup(r, true) +
    '<p class="neighbor-reason">' + esc(neighborReason(r, scores, main)) + '</p>' +
    sourcesDetails(r.person, true) + '</article>';
}

function profileView(scores) {
  return '<details class="profile-details"><summary>看看我的六个处事侧面</summary><div class="profile-body">' +
    E.DIMENSIONS.map(d => '<div class="profile-row"><div class="profile-heading"><strong>' + d.name + '</strong>' +
      '<span>' + d[E.band(scores[d.id])] + '</span></div>' +
      '<div class="profile-track" aria-label="' + d.name + '，' + Math.round(scores[d.id]) + '分">' +
      '<i style="left:' + Math.max(2, Math.min(98, scores[d.id])) + '%"></i></div>' +
      '<div class="profile-ends"><span>' + d.left + '</span><span>' + d.right + '</span></div></div>').join('') +
    '</div></details>';
}

function results() {
  const scores = E.scoreAnswers(QUESTIONS, state.answers);
  const ranked = E.rankPeople(scores, PEOPLE, edition);
  const matches = ranked.slice(0, 3);
  const check = E.stability(scores, QUESTIONS, state.answers, PEOPLE, edition, ranked);
  current = { scores, ranked, matches, check };
  const other = edition === 'china' ? 'world' : 'china';
  return '<section class="result"><p class="result-kicker eyebrow">' + editionData().name + ' · YOUR HISTORY ECHO</p>' +
    '<h1>你的历史回响</h1><p class="result-intro">' + esc(E.summary(scores)) + '</p>' +
    mainCard(matches[0], scores, check) +
    '<div class="result-toolbar">' +
    '<button class="primary-button" data-action="share">留下这份相似 <span aria-hidden="true">↗</span></button>' +
    '<button class="secondary-button" data-action="review">回看我的选择</button></div>' +
    '<div class="result-section-title"><h2>也与你相近的两个人</h2><span>NEARBY ECHOES</span></div>' +
    matches.slice(1).map((r, i) => neighborCard(r, i + 1, scores, matches[0])).join('') +
    profileView(scores) +
    '<section class="other-edition"><p class="eyebrow">ANOTHER LETTER</p>' +
    '<h2>同一份答案，另一种相遇</h2>' +
    '<p>不用重新答题，看看另一组48人中的回响。</p>' +
    '<a class="secondary-button" href="javascript:void(0)" onclick="window.switchEdition(\''+other+'\')">打开' +
    E.EDITIONS.find(e => e.id === other).name + '结果 <span aria-hidden="true">→</span></a></section>' +
    '<div class="result-close"><button class="text-button" data-action="reset">清空答案，重新测试</button></div></section>';
}

function renderRoster() {
  if(!edition) return;
  const people = PEOPLE.filter(p => p.edition === edition);
  document.getElementById('roster-summary').textContent = '查看' + editionData().name + '人物库 · ' + people.length + '位';
  document.getElementById('roster-content').innerHTML = '<p style="font-size:10px; color:#8c9680; margin-bottom:8px;">点开名字，认识这48种不同的人生。</p>' +
    people.map(p => '<details class="roster-person"><summary><span>' + esc(p.name) + '</span><small>' + esc(p.role) + '</small></summary>' +
      '<div><p style="font-size:11px; line-height:1.9; margin-bottom:9px;">' + esc(p.intro) + '</p></div></details>').join('');
}

function showResult() {
  const missing = QUESTIONS.findIndex(q => !E.validOption(q, state.answers[q.id]));
  if (missing !== -1) { state.view = 'quiz'; state.index = missing; }
  else { state.view = 'result'; state.reviewing = false; }
  persist(); render();
}

// 事件处理
document.getElementById('home-link').addEventListener('click', event => {
  event.preventDefault();
  edition = null;
  history.replaceState(null, '', location.pathname);
  render();
});

document.getElementById('about-button').addEventListener('click', () => {
  renderRoster(); document.getElementById('about-dialog').showModal();
});

document.getElementById('confirm-reset').addEventListener('click', () => {
  state = E.normalizeState(null, QUESTIONS); current = null; persist();
  document.getElementById('reset-dialog').close();
  render();
});

document.querySelectorAll('[data-close]').forEach(button =>
  button.addEventListener('click', () => document.getElementById(button.dataset.close).close()));

app.addEventListener('change', event => {
  if (!event.target.matches('input[name="answer"]') || state.view !== 'quiz') return;
  const q = QUESTIONS[state.index], option = E.validOption(q, event.target.value);
  if (!option) return;
  state.answers[q.id] = option.id; current = null; persist();
  app.querySelectorAll('.option').forEach(label => label.classList.toggle('selected', label.querySelector('input').checked));
  document.getElementById('next-button').disabled = false;
  app.querySelector('[role="progressbar"]').setAttribute('aria-valuenow', answered());
  app.querySelector('.progress-fill').style.width = answered() / QUESTIONS.length * 100 + '%';
});

app.addEventListener('click', event => {
  const button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  switch (button.dataset.action) {
    case 'start': {
      const missing = QUESTIONS.findIndex(q => !E.validOption(q, state.answers[q.id]));
      if (missing === -1) showResult();
      else { state.view = 'quiz'; state.index = missing; state.reviewing = false; persist(); render(); }
      break;
    }
    case 'next':
      if (!E.validOption(QUESTIONS[state.index], state.answers[QUESTIONS[state.index].id])) return;
      if (state.index === QUESTIONS.length - 1) showResult();
      else { state.index++; persist(); render(); }
      break;
    case 'previous':
      if (state.index > 0) { state.index--; persist(); render(); }
      break;
    case 'review': state.view = 'quiz'; state.index = 0; state.reviewing = true; persist(); render(); break;
    case 'result': showResult(); break;
    case 'reset': document.getElementById('reset-dialog').showModal(); break;
  }
});

document.addEventListener('click', event => {
  const link = event.target.closest('a[data-edition]');
  if (!link) return;
  event.preventDefault();
  window.switchEdition(link.dataset.edition);
});
</script>

<!-- 包含核心计算与数据合并的底层逻辑 -->
<script>
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.HistoryQuiz = api;
})(globalThis, function () {
  'use strict';
  const VERSION = 2;
  const EDITIONS = [ { id: 'china', name: '中国版', mark: '中', number: '01' }, { id: 'world', name: '外国版', mark: '外', number: '02' } ];
  const DIMENSIONS = [
    { id: 'explore', name: '探索取向', low: '沿用熟悉方法', mid: '选择性尝新', high: '主动尝试新路', left: '熟悉的方法', right: '新的路径' },
    { id: 'organize', name: '事前组织', low: '边做边定细节', mid: '先定关键步骤', high: '先排步骤预案', left: '边做边安排', right: '事前多安排' },
    { id: 'persist', name: '持续投入', low: '较早调整投入', mid: '选择性持续', high: '维持长期投入', left: '较早转换重点', right: '维持反复投入' },
    { id: 'initiate', name: '主动发起', low: '接住已有提议', mid: '有空缺时发起', high: '主动提出安排', left: '响应已有方向', right: '主动提出方向' },
    { id: 'independent', name: '自主判断', low: '借助共同判断', mid: '核对后再决定', high: '形成自己的判断', left: '较多借助共识', right: '自行形成判断' },
    { id: 'care', name: '人际关照', low: '回应明确需要', mid: '择情境留意', high: '主动留意处境', left: '回应已提出的需要', right: '主动留意需要' }
  ];
  const ids = DIMENSIONS.map(d => d.id);
  const clamp = n => Math.max(0, Math.min(100, n));
  const band = value => value <= 100 / 3 + 1e-8 ? 'low' : value >= 200 / 3 - 1e-8 ? 'high' : 'mid';
  const validOption = (question, id) => question.options.find(o => o.id === id);
  const isScore = value => typeof value === 'number' && Number.isFinite(value) && value >= 0 && value <= 100;
  const compareIds = (a, b) => a < b ? -1 : a > b ? 1 : 0;
  
  function compareDistances(a, b) { const delta = a.farSquared - b.farSquared; return Math.abs(delta) <= 1e-9 ? compareIds(a.id, b.id) : delta; }
  
  function scoreAnswers(questions, answers) {
    const sums = Object.fromEntries(ids.map(id => [id, 0]));
    const counts = { ...sums };
    for (const q of questions) {
      if (!ids.includes(q.dimension)) throw new Error('Unknown dimension: ' + q.dimension);
      const option = validOption(q, answers[q.id]);
      if (!option || !Number.isInteger(option.score) || option.score < 0 || option.score > 3) throw new Error('Incomplete answer: ' + q.id);
      sums[q.dimension] += option.score; counts[q.dimension]++;
    }
    return Object.fromEntries(ids.map(id => [id, sums[id] / (counts[id] * 3) * 100]));
  }
  
  function distanceBounds(scores, profile) {
    let nearSquared = 0, farSquared = 0;
    const missing = [];
    for (const id of ids) {
      if (!isScore(scores[id])) throw new Error('Invalid user score: ' + id);
      const h = profile[id];
      if (h === null) { missing.push(id); farSquared += Math.max(scores[id], 100 - scores[id]) ** 2; }
      else {
        if (!isScore(h)) throw new Error('Invalid historical score: ' + id);
        const square = (scores[id] - h) ** 2; nearSquared += square; farSquared += square;
      }
    }
    return { nearSquared: nearSquared / ids.length, farSquared: farSquared / ids.length, minDistance: Math.sqrt(nearSquared / ids.length), maxDistance: Math.sqrt(farSquared / ids.length), coverage: ids.length - missing.length, missing };
  }
  
  const matchPercentage = distance => Math.round(clamp(100 - distance));
  function rankPeople(scores, people, edition) {
    if (!EDITIONS.some(e => e.id === edition)) throw new Error('Unknown edition');
    return people.filter(p => p.edition === edition).map(person => {
      const bounds = distanceBounds(scores, person.profile);
      return { person, ...bounds, matchPercent: matchPercentage(bounds.maxDistance), possiblePercent: matchPercentage(bounds.minDistance) };
    }).sort((a, b) => compareDistances({ id: a.person.id, farSquared: a.farSquared }, { id: b.person.id, farSquared: b.farSquared }));
  }
  
  function hasEvidence(person, id) {
    const anchor = person.anchors?.[id];
    return isScore(person.profile[id]) && anchor && anchor.level === person.profile[id] / 25 &&
      ['moderate', 'limited'].includes(anchor.confidence) && anchor.rationale?.length > 0 &&
      Array.isArray(anchor.evidence) && anchor.evidence.some(i => person.evidence?.[i]?.sourceIds?.length > 0 && person.evidence[i].dimensions?.includes(id));
  }
  
  function closestFacets(scores, person) {
    return DIMENSIONS.filter(d => hasEvidence(person, d.id)).map(d => ({ ...d, user: scores[d.id], target: person.profile[d.id], gap: Math.abs(scores[d.id] - person.profile[d.id]), limited: person.anchors[d.id].confidence === 'limited' }))
      .sort((a, b) => a.gap - b.gap || Number(a.limited) - Number(b.limited) || ids.indexOf(a.id) - ids.indexOf(b.id));
  }
  const sharedFacet = facet => facet.gap <= 25 && band(facet.user) === band(facet.target);
  const selectFacets = (scores, person, count = 3) => closestFacets(scores, person).filter(sharedFacet).slice(0, count);
  const sharedTags = (scores, person) => selectFacets(scores, person).map(d => d[band(d.user)]);
  
  function summary(scores) {
    const selected = [...DIMENSIONS].sort((a, b) => Math.abs(scores[b.id] - 50) - Math.abs(scores[a.id] - 50) || ids.indexOf(a.id) - ids.indexOf(b.id)).slice(0, 2);
    return '这次的选择里，你' + selected[0][band(scores[selected[0].id]) + 'Text'] + '，也' + selected[1][band(scores[selected[1].id]) + 'Text'] + '。';
  }
  
  function chooseAnswerEvidence(facet, questions, answers) {
    const direction = band(facet.user);
    const penalty = option => direction === 'low' && option.score >= 2 || direction === 'high' && option.score <= 1 ? 1 : 0;
    return questions.filter(q => q.dimension === facet.id).map(question => ({ question, option: validOption(question, answers[question.id]) })).filter(x => x.option)
      .sort((a, b) => penalty(a.option) - penalty(b.option) || Math.abs(a.option.score / 3 * 100 - facet.user) - Math.abs(b.option.score / 3 * 100 - facet.user) || compareIds(a.question.id, b.question.id))[0];
  }
  
  function sourceEvent(person, dimension) {
    const indices = person.anchors[dimension]?.evidence || [];
    const selected = indices.find(i => person.evidence[i]?.dimensions?.includes(dimension));
    return selected === undefined ? null : person.evidence[selected] || null;
  }
  
  function difference(scores, person) {
    return closestFacets(scores, person).filter(d => band(d.user) !== band(d.target)).sort((a, b) => b.gap - a.gap || ids.indexOf(a.id) - ids.indexOf(b.id))[0] || null;
  }
  
  function stability(scores, questions, answers, people, edition, ranked) {
    ranked = ranked || rankPeople(scores, people, edition);
    const primary = ranked[0];
    let changed = 0, trials = 0;
    const counts = Object.fromEntries(ids.map(id => [id, questions.filter(q => q.dimension === id).length]));
    for (const q of questions) {
      const current = validOption(q, answers[q.id]);
      for (const delta of [-1, 1]) {
        if (!current || current.score + delta < 0 || current.score + delta > 3) continue;
        const variant = { ...scores, [q.dimension]: clamp(scores[q.dimension] + delta / (counts[q.dimension] * 3) * 100) };
        trials++;
        if (rankPeople(variant, people, edition)[0].person.id !== primary.person.id) changed++;
      }
    }
    const unresolvedCompetitors = ranked.slice(1).filter(r => r.missing.length && compareDistances({ id: r.person.id, farSquared: r.nearSquared }, { id: primary.person.id, farSquared: primary.farSquared }) < 0).length;
    const gap = ranked[1] ? Math.max(0, ranked[1].maxDistance - primary.maxDistance) : 100;
    const exactTie = Boolean(ranked[1] && Math.abs(ranked[1].farSquared - primary.farSquared) <= 1e-9);
    return { changed, trials, unresolvedCompetitors, gap, close: gap <= 2, exactTie };
  }
  
  function normalizeState(raw, questions) {
    const blank = { version: VERSION, view: 'cover', index: 0, answers: {}, reviewing: false };
    if (!raw || raw.version !== VERSION || typeof raw.answers !== 'object' || !raw.answers || Array.isArray(raw.answers)) return blank;
    const answers = {};
    for (const q of questions) if (validOption(q, raw.answers[q.id])) answers[q.id] = raw.answers[q.id];
    let index = Number.isInteger(raw.index) ? Math.max(0, Math.min(questions.length - 1, raw.index)) : 0;
    let view = ['cover', 'quiz', 'result'].includes(raw.view) ? raw.view : 'cover';
    const missing = questions.findIndex(q => !answers[q.id]);
    if (view === 'result' && missing !== -1) { view = 'quiz'; index = missing; }
    if (view === 'quiz' && missing !== -1) index = Math.min(index, missing);
    return { ...blank, view, index, answers, reviewing: missing === -1 && Boolean(raw.reviewing) };
  }
  
  return { VERSION, EDITIONS, DIMENSIONS, band, validOption, isScore, scoreAnswers, distanceBounds, matchPercentage, rankPeople, hasEvidence, closestFacets, sharedFacet, selectFacets, sharedTags, summary, chooseAnswerEvidence, sourceEvent, difference, stability, normalizeState };
});
