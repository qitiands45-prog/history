<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时光来信 · 验证</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f4ee; color: #2b3733; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { max-width: 420px; width: 100%; text-align: center; }
  .brand { font-size: 14px; font-weight: 600; letter-spacing: 1px; margin-bottom: 32px; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .brand-symbol { font-size: 23px; color: #566c5a; }
  .brand-en { font-size: 9px; color: #737b73; letter-spacing: 1.1px; margin-left: 6px; }
  h1 { font-family: "Noto Serif CJK SC","Songti SC","STSong","SimSun",serif; font-size: 38px; font-weight: 500; line-height: 1.5; margin-bottom: 16px; }
  .subtitle { font-size: 14px; color: #70776e; line-height: 1.9; margin-bottom: 36px; }
  
  /* 密码框 */
  .gate { display: block; }
  input { width: 100%; padding: 15px; background: #fbfaf6; border: 1px solid #cdd3c6; border-radius: 6px; color: #566c5a; font-size: 24px; text-align: center; letter-spacing: 10px; margin-bottom: 15px; outline: none; }
  button { width: 100%; padding: 15px; background: #566c5a; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .error { color: #a16952; font-size: 14px; margin-top: 15px; display: none; }

  /* 选择版本链接 (默认隐藏) */
  .links { display: none; flex-direction: column; gap: 14px; margin-top: 20px; }
  .btn-link { display: block; min-height: 54px; padding: 13px; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: 500; }
  .primary { background: #566c5a; color: #fff; }
  .secondary { background: transparent; border: 1px solid #cdd3c6; color: #566c5a; }
</style>
</head>
<body>
<div class="box">
  <div class="brand"><span class="brand-symbol">✳</span>时光来信<span class="brand-en">TIME & YOU</span></div>
  
  <div class="gate" id="gate-area">
    <h1>进入测试</h1>
    <p class="subtitle">请输入您购买后获得的 4 位数字密码</p>
    <input type="text" id="code" placeholder="••••" maxlength="4" autocomplete="off">
    <button onclick="check()">验证并进入</button>
    <p class="error" id="error-msg">密码不正确，请检查后重试。</p>
  </div>

  <div class="links" id="link-area">
    <h1>选择版本</h1>
    <p class="subtitle">请选择你想测的历史人物库</p>
    <a href="china.html" class="btn-link primary">进入中国版 →</a>
    <a href="world.html" class="btn-link secondary">进入外国版 →</a>
  </div>
</div>

<script>
  // 你的密码库
  const VALID_CODES = ["1048", "2159", "3876", "4790", "5621", "8888"];
  
  // 检查是否曾经输入过密码
  if (localStorage.getItem('quiz_unlocked') === 'true') {
    document.getElementById('gate-area').style.display = 'none';
    document.getElementById('link-area').style.display = 'flex';
  }

  function check() {
    const input = document.getElementById('code').value.trim();
    if (VALID_CODES.includes(input)) {
      localStorage.setItem('quiz_unlocked', 'true'); // 记录已解锁
      document.getElementById('gate-area').style.display = 'none';
      document.getElementById('link-area').style.display = 'flex';
    } else {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('code').value = '';
    }
  }
</script>
</body>
</html>
